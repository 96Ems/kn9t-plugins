[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kn9t-mcp"
version = "0.1.0"
description = "MCP client plugin for kn9t - exposes MCP server tools to kn9t agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "kn9t contributors" }]
keywords = ["kn9t", "mcp", "model-context-protocol", "agent", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

# No external dependencies - stdlib only
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
kn9t-mcp = "kn9t_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/kn9t/kn9t"

[tool.hatch.build.targets.wheel]
packages = ["kn9t_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
