[package]
name = "kn9t-websearch"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "kn9t-websearch"
path = "src/main.rs"

[dependencies]
kn9t-plugin-sdk = { path = "../../crates/kn9t-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
