[package]
name = "kn9t-git-integration"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "kn9t-git-integration"
path = "src/main.rs"

[dependencies]
kn9t-plugin-sdk = { path = "../../crates/kn9t-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored"] }
